name: Release Aegis

# Every push that changes the desktop app ships the version in package.json
# so installed copies can update. Bump the version before merging app changes.
on:
  push:
    branches: [main]
    # Only rebuild installers when the desktop app itself changes. Website and
    # docs pushes deploy through Vercel and keep serving the current release.
    paths:
      - 'electron/**'
      - 'src/**'
      - 'build/**'
      - 'extension/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (leave empty to use package.json)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Compute version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Aegis $VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            --title "Aegis $VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

  windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp build version
        run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version --force

      - name: Compile renderer
        run: npm run build

      - name: Package and upload installer
        run: npx --no-install electron-builder --win --publish always

  macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp build version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --force

      - name: Compile renderer
        run: npm run build

      - name: Package and upload universal app
        run: npx --no-install electron-builder --mac --universal --publish always

  linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp build version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --force

      - name: Compile renderer
        run: npm run build

      - name: Package and upload AppImage + deb
        run: npx --no-install electron-builder --linux --publish always

  publish:
    name: Publish release
    needs: [prepare, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Verify update manifests
        run: |
          ASSETS=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx 'latest.yml'
          echo "$ASSETS" | grep -qx 'latest-mac.yml'
          echo "$ASSETS" | grep -qx 'latest-linux.yml'
          echo "$ASSETS" | grep -qx 'Aegis-Linux-x86_64.AppImage'
          echo "$ASSETS" | grep -qx 'Aegis-Linux-x86_64.deb'

      - name: Make the release public
        run: gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest
